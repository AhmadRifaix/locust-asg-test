name: Controlled Locust Load Test
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: controlled-locust-load-test
  cancel-in-progress: false
jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Locust
        run: |
          python -m pip install --upgrade pip
          python -m pip install locust
      - name: Validate target URL
        env:
          TARGET_URL: https://nginx.vai.web.id
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          parsed = urlparse(os.environ["TARGET_URL"])
          if (
              parsed.scheme != "https"
              or parsed.hostname != "nginx.domainkamu.my.id"
              or parsed.username
              or parsed.password
              or parsed.port not in (None, 443)
          ):
              raise SystemExit("Target tidak diizinkan.")
          print(f"Target: {parsed.hostname}")
          PY
      - name: Check target availability
        env:
          TARGET_URL: https://nginx.vai.web.id
        run: |
          curl --fail --silent --show-error \
            --max-time 10 \
            --output /dev/null \
            --write-out "HTTP status: %{http_code}\n" \
            "$TARGET_URL"
      - name: Run Locust
        env:
          TARGET_URL: https://nginx.vai.web.id
        run: |
          locust \
            -f locustfile.py \
            --host "$TARGET_URL" \
            --headless \
            --users 5 \
            --spawn-rate 1 \
            --run-time 30s \
            --stop-timeout 5s \
            --only-summary \
            --exit-code-on-error 1
